[package]
name = "akiva-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Akiva SDK for Rust apps. Provides the #[akiva::app] macro, Activity trait, Resource helpers, Intent builders, and safe wrappers over the WIT bindings generated from wit/akiva.wit."

[lib]
crate-type = ["rlib"]

[features]
default = []
# Enable to expose raw WIT bindings. Off by default so app code stays on
# the stable high-level API.
bindings = []

[dependencies]
# Stone 11.2 spike — async fn in trait via boxed futures. AFIT in stable
# Rust 1.75+ doesn't compose with `dyn Trait`; until we redesign the
# runtime slot table to be generic over the concrete activity type
# (deferred to a follow-up commit in 11.2), `async_trait` is the
# pragmatic bridge.
async-trait = "0.1"
# Stone 11.6.7 #2 — shared wire-format codecs.
akiva-wire = { workspace = true }
# Stone 11.6.8 #1 — RNG primitive via the ecosystem-standard getrandom
# crate. The `custom` feature lets us register `akiva_host_random_bytes`
# as the system getrandom backend, which makes every crate that depends
# on getrandom (rand, uuid, ring, rustls, chacha20poly1305, …) work
# automatically inside Akiva apps with zero app-side glue.
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
# Stone 11.6.8 #1 — proves the getrandom hook is wired correctly:
# `Uuid::new_v4()` calls `getrandom::getrandom` under the hood, which
# routes to our custom backend, which calls `akiva_host_random_bytes`.
# Pinned to <=1.10 so the transitive `getrandom` resolves to 0.2 (newer
# uuid pulls getrandom 0.3+ which currently requires edition2024 / Rust
# 1.85+, ahead of our 1.82 floor).
uuid = { version = "<=1.10", features = ["v4"] }

[package.metadata.akiva]
role = "sdk"
