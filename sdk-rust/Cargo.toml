[package]
name = "akiva-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Akiva SDK for Rust apps. Provides the #[akiva::app] macro, Activity trait, Resource helpers, Intent builders, and safe wrappers over the WIT bindings generated from wit/akiva.wit."

[lib]
crate-type = ["rlib"]

[features]
default = []
# Enable to expose raw WIT bindings. Off by default so app code stays on
# the stable high-level API.
bindings = []

[dependencies]
# Stone 11.2 spike — async fn in trait via boxed futures. AFIT in stable
# Rust 1.75+ doesn't compose with `dyn Trait`; until we redesign the
# runtime slot table to be generic over the concrete activity type
# (deferred to a follow-up commit in 11.2), `async_trait` is the
# pragmatic bridge.
async-trait = "0.1"

[package.metadata.akiva]
role = "sdk"
