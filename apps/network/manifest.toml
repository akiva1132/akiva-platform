[app]
id = "com.akiva.network"
name = "Network"
version = "0.1.0"
version_code = 1
min_abi_version = "0.12.0"
authors = ["Akiva Team"]
description = "Smoke-test for the NETWORK capability — runs an HTTPS request and a WebSocket echo round-trip."
icon = "@drawable/icon"
category = "utilities"

[runtime]
wasm = "akiva_app_network.wasm"
min_memory_mb = 1
max_memory_mb = 4

[[activities]]
id = "main"
class = "NetworkMain"
entry = true
launch_mode = "singleTop"
exported = true

[[activities.intent_filters]]
actions = ["akiva.intent.action.MAIN"]
categories = ["akiva.intent.category.LAUNCHER"]

[permissions]
# Stone 14.1 — declared at install time; auto-granted today
# (`ProtectionLevel::Normal`). Upgrading to `Dangerous` (runtime
# prompt) is a follow-up stone.
# Stone 14.3 — NOTIFICATIONS for the system-tray demo button. The
# *system* grant is auto-granted; the *browser* permission still
# requires a user-gesture call to `notification::request_permission`.
required = [
    "akiva.permission.NETWORK",
    "akiva.permission.NOTIFICATIONS",
    "akiva.permission.CLIPBOARD",
    "akiva.permission.VIBRATE",
    "akiva.permission.LOCATION",
]
optional = []

[display]
default_width_dp = 400
default_height_dp = 600
resizable = true
