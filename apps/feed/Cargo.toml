[package]
name = "akiva-app-feed"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Akiva Team"]
license = "MIT"
description = "SDK demo: virtualised feed — Node::Scroll + Node::LazyColumn + Akiva-owned fling."

[lib]
crate-type = ["cdylib"]

[dependencies]
akiva-sdk = { path = "../../sdk-rust" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
