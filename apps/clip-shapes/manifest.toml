[app]
id = "com.akiva.clipshapes"
name = "Clip Shapes"
version = "0.1.0"
version_code = 1
min_abi_version = "0.1.0"
authors = ["Akiva Team"]
description = "Showcases the SDK's rounded-clip primitive: circular avatars, pills, cards."
icon = "@drawable/icon"
category = "samples"

[runtime]
wasm = "app.wasm"
min_memory_mb = 1
max_memory_mb = 4

[[activities]]
id = "main"
class = "ClipShapesMain"
entry = true
launch_mode = "singleTop"
exported = true

[[activities.intent_filters]]
actions = ["akiva.intent.action.MAIN"]
categories = ["akiva.intent.category.LAUNCHER"]

[permissions]
required = []
optional = []

[display]
default_width_dp = 400
default_height_dp = 600
resizable = true
