[app]
id = "com.akiva.tictactoe"
name = "Tic Tac Toe"
version = "0.1.0"
version_code = 1
min_abi_version = "0.1.0"
authors = ["Akiva Team"]
description = "Classic 3×3 tic-tac-toe. Akiva's second app, proving the widget toolkit works beyond the calculator."
category = "games"

[runtime]
wasm = "akiva_app_tic_tac_toe.wasm"
min_memory_mb = 1
max_memory_mb = 4

[[activities]]
id = "main"
class = "TicTacToeMain"
entry = true
launch_mode = "singleTop"
exported = true

[[activities.intent_filters]]
actions = ["akiva.intent.action.MAIN"]
categories = ["akiva.intent.category.LAUNCHER"]

[permissions]
# STORAGE_SANDBOX: board state persists across destroy-restore via
# on_save_state / on_restore_state. Auto-granted at install time.
required = ["akiva.permission.STORAGE_SANDBOX"]
optional = []

[display]
default_width_dp = 400
default_height_dp = 600
resizable = true
