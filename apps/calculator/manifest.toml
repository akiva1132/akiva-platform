[app]
id = "com.akiva.calculator"
name = "Calculator"
version = "0.1.0"
version_code = 1
min_abi_version = "0.1.0"
authors = ["Akiva Team"]
description = "Pocket calculator — the first app built entirely on the Akiva widget toolkit."
category = "utilities"

[runtime]
wasm = "calculator.wasm"
min_memory_mb = 1
max_memory_mb = 4

[[activities]]
id = "main"
class = "CalculatorMain"
entry = true
launch_mode = "singleTop"
exported = true

[[activities.intent_filters]]
actions = ["akiva.intent.action.MAIN"]
categories = ["akiva.intent.category.LAUNCHER"]

[permissions]
# STORAGE_SANDBOX: calculator persists display/accumulator state across
# destroy-restore via on_save_state / on_restore_state. Auto-granted at
# install time (ProtectionLevel::Normal in v0.2).
required = ["akiva.permission.STORAGE_SANDBOX"]
optional = []

[display]
default_width_dp = 360
default_height_dp = 600
resizable = true
