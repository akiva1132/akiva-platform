[package]
name = "akiva-app-calculator"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Akiva Team"]
license = "MIT"
description = "First real Akiva app: a pocket calculator built on the Phase 3a widget toolkit."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
akiva-sdk = { path = "../../sdk-rust" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
